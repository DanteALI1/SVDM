apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: svdb
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/example/svdb-frontend:latest
          env:
            - name: API_URL
              value: http://backend:8000
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: svdb
spec:
  ports:
    - port: 3000
  selector:
    app: frontend
